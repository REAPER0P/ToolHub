<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Rotator & Flipper</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #e4ecff, #f7f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Main Card */
.tool-container {
  background: #ffffff;
  width: 100%;
  max-width: 540px;
  border-radius: 26px;
  padding: 32px 28px 36px;
  box-shadow: 0 15px 40px rgba(0, 87, 255, 0.15);
  text-align: center;
}

/* Title */
.tool-container h1 {
  color: #0057ff;
  margin-bottom: 18px;
  font-size: 1.9rem;
}

/* Upload Wrapper (important for centering) */
.upload-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

/* Upload Box */
.upload-box {
  width: 100%;
  max-width: 100%;
  border: 2.5px dashed #007bff;
  border-radius: 22px;
  padding: 55px 20px;
  background: linear-gradient(135deg, #eef4ff, #f9fbff);
  color: #0057ff;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.upload-box span {
  display: block;
  font-size: 0.95rem;
  font-weight: 400;
  margin-top: 6px;
  color: #3b6cff;
}

.upload-box:hover {
  background: linear-gradient(135deg, #dde8ff, #f0f5ff);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0, 87, 255, 0.18);
}

input[type="file"] {
  display: none;
}

/* Preview */
.preview-area {
  margin-top: 22px;
  display: none;
}

.preview-area img {
  max-width: 100%;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.18);
}

/* Controls */
.controls {
  display: none;
  margin-top: 22px;
  gap: 12px;
  flex-wrap: wrap;
}

.controls button {
  flex: 1 1 calc(50% - 6px);
  padding: 13px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #007bff, #0057ff);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
}

.controls button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,87,255,0.35);
}

/* Download */
.download-btn {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #00c6a9, #00b894);
  color: white;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  display: none;
  transition: 0.25s;
}

.download-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(0,184,148,0.4);
}

/* Mobile */
@media (max-width: 480px) {
  .controls button {
    flex: 1 1 100%;
  }
}
</style>
</head>

<body>

<div class="tool-container">
  <h1>Image Rotator & Flipper</h1>

  <div class="upload-wrapper">
    <label class="upload-box" for="imageInput">
      📤 Upload Image
      <span>Click to select an image</span>
    </label>
  </div>
  <input type="file" id="imageInput" accept="image/*">

  <div class="preview-area" id="previewArea">
    <img id="previewImage">
  </div>

  <div class="controls" id="controls">
    <button onclick="rotateLeft()">⟲ Rotate Left</button>
    <button onclick="rotateRight()">⟳ Rotate Right</button>
    <button onclick="flipHorizontal()">↔ Flip Horizontal</button>
    <button onclick="flipVertical()">↕ Flip Vertical</button>
  </div>

  <button class="download-btn" id="downloadBtn" onclick="downloadImage()">⬇ Download Image</button>
</div>

<script>
const imageInput = document.getElementById('imageInput');
const previewImage = document.getElementById('previewImage');
const previewArea = document.getElementById('previewArea');
const controls = document.getElementById('controls');
const downloadBtn = document.getElementById('downloadBtn');

let rotation = 0;
let scaleX = 1;
let scaleY = 1;
let originalImage = new Image();

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    originalImage.src = reader.result;
    previewImage.src = reader.result;
    previewArea.style.display = 'block';
    controls.style.display = 'flex';
    downloadBtn.style.display = 'block';

    rotation = 0;
    scaleX = 1;
    scaleY = 1;
    applyTransform();
  };
  reader.readAsDataURL(file);
});

function applyTransform() {
  previewImage.style.transform =
    `rotate(${rotation}deg) scale(${scaleX}, ${scaleY})`;
}

function rotateLeft() { rotation -= 90; applyTransform(); }
function rotateRight() { rotation += 90; applyTransform(); }
function flipHorizontal() { scaleX *= -1; applyTransform(); }
function flipVertical() { scaleY *= -1; applyTransform(); }

function downloadImage() {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const angle = rotation * Math.PI / 180;

  const w = originalImage.width;
  const h = originalImage.height;

  if (Math.abs(rotation % 180) === 90) {
    canvas.width = h;
    canvas.height = w;
  } else {
    canvas.width = w;
    canvas.height = h;
  }

  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(angle);
  ctx.scale(scaleX, scaleY);
  ctx.drawImage(originalImage, -w / 2, -h / 2);

  const link = document.createElement('a');
  link.download = 'edited-image.png';
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
